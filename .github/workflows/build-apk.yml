name: Build debug APK

# 本仓库在你本机没有 JDK / Android SDK 时也能出货：
# 推到 GitHub 后跑这个工作流，直接下载编译好的 app-debug.apk。
# 同时它也回答了一个问题 —— 代码到底能不能编译通过。

on:
  push:
    branches: [ main, master ]
    paths:
      - 'NbKeyboardBridge/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'NbKeyboardBridge/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NbKeyboardBridge

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run lint (does not fail the build)
        run: gradle lintDebug --no-daemon --continue
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nb-keyboard-bridge-debug-apk
          path: NbKeyboardBridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: NbKeyboardBridge/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
